<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notre Famille V35 — Dan Moussa</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+Ethiopic:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fond:#FBF6EC;--carte:#fff;--ligne:#E6DAC4;--vert:#155E4B;--or:#D89A2B;--henne:#8C3B22;--txt:#2A2318;--doux:#8A7A5F;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans','Noto Sans Ethiopic','Noto Naskh Arabic',sans-serif;background:var(--fond);color:var(--txt);font-size:15px}
body.nuit{--fond:#171208;--carte:#241C0E;--ligne:#3A2F1B;--txt:#F1E6CE;--doux:#B5A585}
h1,h2,h3{font-family:'Unbounded',sans-serif;letter-spacing:-.02em}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--vert);color:#fff;padding:16px 18px 12px;position:sticky;top:0;z-index:20}
header h1{font-size:19px}header h1 span{color:var(--or)}
header .sal{font-size:12.5px;opacity:.9;margin-top:3px}
.natte{height:8px;background:repeating-linear-gradient(90deg,var(--or) 0 14px,var(--henne) 14px 28px,#2E3A87 28px 42px,#fff 42px 44px)}
.topbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.topbar select,.topbar button{border:none;border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.topbar select option{color:#222}
main{flex:1;padding:14px 16px 92px}
.ecr{display:none}.ecr.on{display:block;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.carte{background:var(--carte);border:1.5px solid var(--ligne);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.sect h2{font-size:15px}
.hint{font-size:12.5px;color:var(--doux);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.s1{background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:10px 4px;text-align:center}
.s1 b{font-size:19px;display:block;color:var(--vert)}
body.nuit .s1 b{color:var(--or)}
.s1 small{font-size:10px;color:var(--doux)}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--ligne);border-radius:11px;padding:10px 12px;background:var(--carte);color:var(--txt);width:100%}
.btn{border:none;border-radius:11px;padding:11px 15px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn.p{background:var(--vert);color:#fff}.btn.o{background:var(--or);color:#3A2A08}
.btn.g{background:none;border:1.5px solid var(--ligne);color:var(--txt)}
.btn.small{padding:7px 11px;font-size:12px;border-radius:9px}
.frow{display:flex;gap:8px;margin-top:8px}.frow>*{flex:1}
.lb{font-size:11.5px;font-weight:700;color:var(--doux);display:block;margin:9px 0 4px}
.membre{display:flex;gap:11px;align-items:center;background:var(--carte);border:1.5px solid var(--ligne);border-radius:13px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.membre .av{width:44px;height:44px;border-radius:50%;background:var(--fond);display:grid;place-items:center;font-size:22px;border:2px solid var(--or);flex-shrink:0}
.membre b{font-size:14px}.membre small{display:block;color:var(--doux);font-size:11.5px}
.gen{font-size:10px;font-weight:700;background:var(--vert);color:#fff;border-radius:6px;padding:2px 7px;margin-inline-start:auto}
.arbre ul{list-style:none;padding-inline-start:20px;border-inline-start:2px dashed var(--ligne);margin-inline-start:9px}
.noeud{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.noeud .pli{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ligne);background:var(--carte);font-size:11px;display:grid;place-items:center;flex-shrink:0;color:var(--txt)}
.noeud .nm{font-size:13.5px;font-weight:600}
.noeud .nm small{color:var(--doux);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--ligne);background:var(--carte);border-radius:15px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--doux);font-family:inherit}
.chip.on{background:var(--vert);color:#fff;border-color:var(--vert)}
.frise{border-inline-start:3px solid var(--or);padding-inline-start:14px}
.ev{position:relative;padding:8px 0}
.ev b{font-size:13.5px}.ev small{color:var(--doux);display:block;font-size:11.5px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--carte);border-top:1.5px solid var(--ligne);display:flex;padding:8px 4px 12px;z-index:30}
nav button{flex:1;border:none;background:none;font-size:19px;color:var(--doux);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit}
nav button small{font-size:9.5px;font-weight:700}
nav button.on{color:var(--vert)}body.nuit nav button.on{color:var(--or)}
#fiche{position:fixed;inset:0;z-index:60;display:none}#fiche.on{display:block}
#fiche .fd{position:absolute;inset:0;background:rgba(15,10,3,.6)}
#fiche .pan{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;background:var(--fond);border-radius:22px 22px 0 0;padding:18px 20px 26px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--vert);color:#fff;padding:10px 17px;border-radius:13px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.livre .m1{padding:9px 0;border-bottom:1.5px dashed var(--ligne);font-size:13.5px}
.livre .m1:last-child{border:none}.livre small{color:var(--doux)}
.reactF{border:none;background:var(--fond);border-radius:11px;padding:2px 9px;font-size:12px;cursor:pointer;margin-top:5px;color:var(--txt);font-family:inherit}
.diasp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.d1{background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:10px 4px;text-align:center}
.d1 b{font-size:20px;display:block}.d1 small{font-size:10.5px;color:var(--doux);display:block}
.ringF{width:86px;height:86px;border-radius:50%;position:relative;display:grid;place-items:center;flex-shrink:0}
.ringF i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--or) var(--deg,0deg),var(--ligne) 0)}
.ringF b{position:relative;background:var(--fond);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.ldrF{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1.5px dashed var(--ligne);font-size:13.5px}
.ldrF:last-child{border:none}.ldrF span:last-child{margin-inline-start:auto;color:var(--doux);font-size:12px}
.diapo{text-align:center;padding:22px 10px}.diapo .av{font-size:64px}
.confF{position:fixed;top:-12px;font-size:17px;z-index:95;animation:chF 2.3s linear forwards;pointer-events:none}
@keyframes chF{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
html[dir=rtl] .gen,html[dir=rtl] .ldrF span:last-child{margin-inline-start:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>🌳 <span data-i18n="appTitre">Notre Famille</span> <small style="font-size:10px;opacity:.7">V35</small></h1>
  <div class="sal" id="sal" data-i18n="sal">–</div>
  <div class="topbar">
    <select id="lang" onchange="setLang(this.value)"></select>
    <button onclick="basculerNuit()">🌙</button>
    <button onclick="basculerSon()" id="bSon">🔊</button>
    <button onclick="exporter()">📤</button>
    <button onclick="document.getElementById('impF').click()">📥</button>
    <input type="file" id="impF" accept=".json" style="display:none" onchange="importer(this)">
  </div>
</header>
<div class="natte"></div>
<main>

<section class="ecr on" id="e0">
  <div class="carte" style="background:var(--vert);color:#fff;border:none">
    <div style="font-size:12px;opacity:.85">📜 <span data-i18n="tprov">–</span></div>
    <p id="proverbe" style="margin-top:6px;font-size:14px;line-height:1.5">–</p>
  </div>
  <div class="carte" style="display:flex;gap:12px;align-items:center">
    <div style="font-size:28px">🔥</div>
    <div style="flex:1"><b style="font-size:13.5px"><span data-i18n="serie">–</span> : <span id="stF">1</span> <span data-i18n="jr">j</span></b>
    <p class="hint" data-i18n="serieH">–</p></div>
    <button class="btn o small" id="ckF" onclick="ckFam()" data-i18n="saluer">–</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="sect"><h2 data-i18n="anniv">–</h2></div>
  <div id="annivs"></div>
  <div class="sect"><h2 data-i18n="frise">–</h2></div>
  <div class="carte frise" id="frise"></div>
  <div class="sect"><h2 data-i18n="diasp">–</h2></div>
  <div class="diasp" id="diasp"></div>
  <div class="carte" style="display:flex;gap:14px;align-items:center;margin-top:12px">
    <div class="ringF" id="ringC"><i></i><b id="ringCT">0%</b></div>
    <div><b style="font-size:13.5px" data-i18n="fiches">–</b><p class="hint" data-i18n="fichesH">–</p></div>
  </div>
  <div class="sect"><h2 data-i18n="evt">–</h2></div>
  <div class="carte livre" id="evts"></div>
  <div class="frow">
    <button class="btn o" onclick="evt('n')" data-i18n="naiss">–</button>
    <button class="btn g" onclick="evt('m')" data-i18n="mari">–</button>
  </div>
</section>

<section class="ecr" id="e1">
  <input id="q" oninput="rendreMembres()" data-ph="searchPH">
  <div class="chips" id="chGen"></div>
  <div class="chips" id="chPays"></div>
  <div id="liste"></div>
</section>

<section class="ecr" id="e2">
  <p class="hint" style="margin-bottom:8px" data-i18n="arbreH">–</p>
  <div class="carte arbre" id="arbre"></div>
</section>

<section class="ecr" id="e3">
  <div class="carte">
    <h2 style="font-size:15px" data-i18n="lien">–</h2>
    <div class="frow"><select id="lA"></select><select id="lB"></select></div>
    <button class="btn p" style="margin-top:10px;width:100%" onclick="calcLien()" data-i18n="calc">–</button>
    <p class="hint" id="lienRes" style="margin-top:10px"></p>
  </div>
  <div class="carte">
    <h2 style="font-size:15px" data-i18n="myst">–</h2>
    <p class="hint" id="mystI" style="margin:8px 0">–</p>
    <div class="frow"><select id="mystS"></select>
    <button class="btn p small" onclick="deviner()" data-i18n="deviner">–</button></div>
  </div>
  <div class="carte">
    <h2 style="font-size:15px" data-i18n="quiz">–</h2>
    <p class="hint" style="margin:6px 0"><span data-i18n="score">–</span> : <b id="qS">0</b> · <span data-i18n="srie">–</span> : <b id="qSer">0</b> 🔥</p>
    <p id="quizQ" class="hint" style="margin:8px 0">–</p>
    <div id="quizR"></div>
  </div>
  <div class="carte">
    <h2 style="font-size:15px" data-i18n="diapo">–</h2>
    <p class="hint" data-i18n="diapoH">–</p>
    <button class="btn o small" style="margin-top:8px" onclick="diapo()" data-i18n="lancer">–</button>
  </div>
  <div class="carte livre">
    <h2 style="font-size:15px" data-i18n="livre">–</h2>
    <div id="livre"></div>
    <div class="frow"><input id="lMsg" data-ph="msgPH"><button class="btn p small" onclick="signer()" data-i18n="signer">–</button></div>
  </div>
  <div class="carte">
    <h2 style="font-size:15px" data-i18n="gard">–</h2>
    <div id="gardiens" style="margin-top:8px"></div>
    <p class="hint" style="margin-top:6px" data-i18n="gardH">–</p>
  </div>
</section>

<section class="ecr" id="e4">
  <div class="carte">
    <h2 style="font-size:15px" data-i18n="ajout">–</h2>
    <label class="lb" data-i18n="fNom">–</label><input id="aNom" data-ph="phNom">
    <div class="frow">
      <div><label class="lb" data-i18n="fGenre">–</label><select id="aG"></select></div>
      <div><label class="lb" data-i18n="fAn">–</label><input id="aAn" type="number" placeholder="1995"></div>
    </div>
    <div class="frow">
      <div><label class="lb" data-i18n="fVille">–</label><input id="aVille" data-ph="fVille"></div>
      <div><label class="lb" data-i18n="fPays">–</label><input id="aPays" data-ph="fPays"></div>
    </div>
    <label class="lb" data-i18n="fParent">–</label><select id="aParent"></select>
    <button class="btn p" style="width:100%;margin-top:12px" onclick="ajouter()" data-i18n="ajBtn">–</button>
  </div>
</section>

</main>
<nav>
  <button class="on" onclick="ecran(0,this)">🏠<small data-i18n="n0">–</small></button>
  <button onclick="ecran(1,this)">👥<small data-i18n="n1">–</small></button>
  <button onclick="ecran(2,this)">🌳<small data-i18n="n2">–</small></button>
  <button onclick="ecran(3,this)">🧩<small data-i18n="n3">–</small></button>
  <button onclick="ecran(4,this)">➕<small data-i18n="n4">–</small></button>
</nav>
<div id="fiche"><div class="fd" onclick="fermer()"></div><div class="pan" id="fbody"></div></div>
<div class="toast" id="toast"></div>
</div>

 else if(da===1||db===1)r=F('lienOncle',{C:com.nom});
 else r=F('lienCous',{n:Math.min(da,db),C:com.nom});
 $('lienRes').innerHTML='🔗 <b>'+r+'</b>';bip(700)}

function quiz(){const m=M[Math.floor(Math.random()*M.length)];quizRep=m;
 const rep=[m.nom,...M.filter(x=>x!==m).sort(()=>Math.random()-.5).slice(0,2).map(x=>x.nom)].sort(()=>Math.random()-.5);
 $('quizQ').textContent=F('quizQ',{a:m.na,v:m.ville});
 $('quizR').innerHTML=rep.map((r,i)=>`<button class="chip" style="margin:3px" onclick="repQuiz(${i})">${r}</button>`).join('');
 $('quizR').dataset.rep=JSON.stringify(rep)}
function repQuiz(i){const rep=JSON.parse($('quizR').dataset.rep);
 if(rep[i]===quizRep.nom){QSCORE+=10;QSERIE++;if(QSERIE%3===0)confF();toast(F('bravo',{n:QSERIE}))}
 else{QSERIE=0;toast(T('rate'))}
 $('qS').textContent=QSCORE;$('qSer').textContent=QSERIE;quiz()}

function rendreMystere(){if(!MYST.m)MYST.m=M[new Date().getDate()%M.length];
 const m=MYST.m;
 if(MYST.trouve){$('mystI').innerHTML='✅ <b>'+m.nom+'</b> — '+T('demain');return}
 $('mystI').textContent=[,F('ind1',{g:gener(m)}),F('ind2',{v:m.ville}),F('ind3',{a:m.na})][Math.min(3,indice)]}
function deviner(){const m=MYST.m;
 if(+$('mystS').value===m.id){MYST.trouve=true;confF();toast(F('trouve',{N:m.nom}));rendreMystere();return}
 indice++;
 if(indice<=3){rendreMystere();toast(T('encore'))}
 else{$('mystI').textContent=F('perdu',{N:m.nom})+' — '+T('demain');toast(F('perdu',{N:m.nom}))}}

function diapo(){let i=0;$('fiche').classList.add('on');
 const step=()=>{const m=M[i%M.length];
  $('fbody').innerHTML=`<div class="diapo"><div class="av">${av(m)}</div>
   <h2 style="font-size:18px;margin:8px 0">${m.nom}</h2>
   <p class="hint">${m.na} · ${m.ville}, ${m.pays} ${DRAP[m.pays]||''} · ${T('gene')} ${gener(m)}</p>
   <p class="hint" style="margin-top:8px">${i+1} / ${M.length}</p>
   <button class="btn g small" style="margin-top:12px" onclick="fermer()">${T('stop')}</button></div>`;i++};
 step();clearInterval(diapoT);diapoT=setInterval(step,2200)}

function rendreLivre(){$('livre').innerHTML=LIVRE.map((l,i)=>
 `<div class="m1">« ${l.m} »<br><small>— ${l.nk?T(l.nk):l.n}</small><br>
  <button class="reactF" onclick="amin(${i})">${T('amin')} · ${l.r}</button></div>`).join('')}
function amin(i){LIVRE[i].r++;bip(700);rendreLivre()}
function signer(){const m=$('lMsg').value.trim();if(!m)return toast(T('videM'));
 LIVRE.unshift({nk:'toi',m,r:0});$('lMsg').value='';CONTRIB++;rendreLivre();rendreGardiens();toast(T('signOK'))}
function rendreGardiens(){$('gardiens').innerHTML=
 `<div class="ldrF">🥇 <b>Hadiza</b><span>12 ${T('g1')}</span></div>
  <div class="ldrF">🥈 <b>Zainab</b><span>8 ${T('g2')}</span></div>
  <div class="ldrF">🥉 <b>${T('toi')}</b><span>${CONTRIB} ${T('contribs')}</span></div>`}

function ajouter(){const nom=$('aNom').value.trim();if(!nom)return toast(T('nomOb'));
 M.push({id:NEXTID++,p:+$('aParent').value,nom,g:$('aG').value,na:+$('aAn').value||2000,dc:null,
  ville:$('aVille').value||'—',pays:$('aPays').value||'Cameroun'});
 $('aNom').value='';$('aAn').value='';CONTRIB++;confF();bip(880);
 const nv=M[M.length-1];toutRendre();toast(F('ajOK',{N:nom,g:gener(nv)}))}
function exporter(){const b=new Blob([JSON.stringify(M,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='famille-dan-moussa.json';a.click();toast(T('expOK'))}
function importer(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);
  if(Array.isArray(d)&&d.length&&d[0].nom){M=d;NEXTID=Math.max(...M.map(x=>x.id))+1;MYST.m=null;MYST.trouve=false;indice=1;
   toutRendre();toast(T('impOK')+' '+M.length)}else toast(T('impBad'))}catch(e){toast(T('impBad'))}};
 r.readAsText(f)}

function toutRendre(){rendreAccueil();rendreMembres();rendreArbre();rendreSelects();rendreLivre();rendreGardiens();rendreMystere();quiz()}
document.documentElement.lang=LG;document.documentElement.dir=(LG==='ar')?'rtl':'ltr';
appliquer();
</script>
</body>
</html>
